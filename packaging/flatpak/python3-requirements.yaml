# Python dependencies not provided by io.qt.PySide.BaseApp (which ships PySide6 and numpy).
# Regenerate with flatpak-builder-tools' pip generator (needs org.kde.Sdk//6.11 installed):
#   flatpak-pip-generator --runtime org.kde.Sdk//6.11 --prefer-wheels cryptography --yaml \
#     --output python3-requirements 'mutagen>=1.46' 'keyring>=24'
# then re-add the python3-setuptools module below (the generator skips setuptools); building
# Hallucinate itself needs setuptools>=77 and Flathub builds have no network access.
name: python3-requirements
buildsystem: simple
build-commands: []
modules:
  - name: python3-setuptools
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "setuptools>=77" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/95/9c/c510029fc6ef33a6275cd2c5d3cecd6613dfd6aa401d57c54f1c18852ccf/setuptools-84.0.0-py3-none-any.whl
        sha256: 51a52592b3b99e102b609654876bd65f19f999935166d1352678931132b0c670
  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "mutagen>=1.46" --no-build-isolation
    sources:
      - type: file
