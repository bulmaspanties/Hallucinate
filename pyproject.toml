[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicplayer"
version = "0.1.0"
description = "A fast, modern desktop music player with Spotify-style search and browsing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5", "mutagen>=1.46", "keyring>=24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.gui-scripts]
musicplayer = "musicplayer.app:main"

[tool.setuptools]
packages = ["musicplayer", "musicplayer.core"]

[tool.setuptools.package-data]
musicplayer = ["qml/*", "assets/*", "themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
