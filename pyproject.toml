[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinate"
version = "0.4.0"
description = "A fast, modern desktop music player with Spotify-style search and browsing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # PySide6 6.12.0 drops a reference to True on every signal emit; Python 3.12+ is immune (True is immortal),
    # older Pythons eventually free True and crash. Lift this once a fixed PySide6 is released.
    "PySide6>=6.11.2,<6.12; python_version < '3.12'",
    "PySide6>=6.11.2; python_version >= '3.12'",
    "mutagen>=1.48.1",
    "keyring>=25.7.0",
    "numpy>=1.24",
    # Windows media controls (SMTC)
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://bulmaspanties.github.io/Hallucinate/"
Source = "https://github.com/bulmaspanties/Hallucinate"
Issues = "https://github.com/bulmaspanties/Hallucinate/issues"
Changelog = "https://github.com/bulmaspanties/Hallucinate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=9.1.1"]
icons = ["Pillow>=9"]

[project.gui-scripts]
hallucinate = "hallucinate.app:main"
musicplayer = "hallucinate.app:main"

[tool.setuptools]
packages = ["hallucinate", "hallucinate.core", "musicplayer"]

[tool.setuptools.package-data]
hallucinate = ["qml/*", "assets/*", "themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E701", "E702", "E501", "E741", "F841"]
