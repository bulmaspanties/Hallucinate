[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hallucinate"
version = "0.3.1"
description = "A fast, modern desktop music player with Spotify-style search and browsing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.11.2", "mutagen>=1.46", "keyring>=24", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
icons = ["Pillow>=9"]

[project.gui-scripts]
hallucinate = "hallucinate.app:main"
musicplayer = "hallucinate.app:main"

[tool.setuptools]
packages = ["hallucinate", "hallucinate.core", "musicplayer"]

[tool.setuptools.package-data]
hallucinate = ["qml/*", "assets/*", "themes/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E701", "E702", "E501", "E741", "F841"]
