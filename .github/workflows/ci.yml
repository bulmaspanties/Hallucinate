name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0 dbus
      - run: pip install -e '.[test]'
      - run: dbus-run-session -- pytest -vv

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Flatpak and Flathub's builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ffmpeg
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Build Flatpak
        run: |
          # Build like Flathub does; it commits the mirrored screenshots to the repo for the linter.
          # The sandboxed builder installs dependencies through the host's flatpak over D-Bus.
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --install-deps-from=flathub \
            --mirror-screenshots-url=https://dl.flathub.org/media/ \
            --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.bulmaspanties.Hallucinate.yml
          flatpak remote-add --user --no-gpg-verify --if-not-exists local-build flatpak-repo
          flatpak install --user -y --noninteractive local-build io.github.bulmaspanties.Hallucinate
      - name: Smoke test (offscreen)
        run: |
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen \
            --env=HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
            --env=HALLUCINATE_CONTROL_SOCKET=hallucinate-flatpak-smoke \
            io.github.bulmaspanties.Hallucinate --quit-after 3000
      - name: Audio decodes inside the Flatpak
        run: |
          clips="$RUNNER_TEMP/clips"
          mkdir -p "$clips"
          src=(-loglevel error -f lavfi -i sine=frequency=440:duration=3 -ac 2)
          ffmpeg "${src[@]}" -c:a libmp3lame "$clips/tone.mp3"
          ffmpeg "${src[@]}" -c:a aac "$clips/aac.m4a"
          ffmpeg "${src[@]}" -c:a alac "$clips/alac.m4a"
          ffmpeg "${src[@]}" -c:a flac "$clips/tone.flac"
          ffmpeg "${src[@]}" -c:a libvorbis "$clips/tone.ogg"
          ffmpeg "${src[@]}" -c:a libopus "$clips/tone.opus"
          cp packaging/flatpak/decode_check.py "$clips/"
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen --filesystem="$clips":ro \
            --command=python3 io.github.bulmaspanties.Hallucinate "$clips/decode_check.py" \
            "$clips/tone.mp3" "$clips/aac.m4a" "$clips/alac.m4a" "$clips/tone.flac" \
            "$clips/tone.ogg" "$clips/tone.opus"
      - name: Flathub linter
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest packaging/flatpak/io.github.bulmaspanties.Hallucinate.yml
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo flatpak-repo

  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git namcap python-build python-installer python-setuptools \
            python-wheel pyside6 python-mutagen python-keyring python-numpy qt6-multimedia-ffmpeg qt6-declarative
          useradd -m builder
          chown -R builder .
      - name: .SRCINFO matches PKGBUILD
        run: |
          for p in hallucinate hallucinate-git; do
            (cd "packaging/aur/$p" && sudo -u builder makepkg --printsrcinfo | diff -u .SRCINFO -)
          done
      - name: Build, lint and install the stable package
        working-directory: packaging/aur/hallucinate
        run: |
          sudo -u builder makepkg --noconfirm
          namcap PKGBUILD ./*.pkg.tar.zst
          pacman -U --noconfirm ./*.pkg.tar.zst
      - name: Build this checkout the way hallucinate-git does
        run: sudo -u builder python -m build --wheel --no-isolation --outdir /tmp/git-build
      - name: Smoke test the installed package (offscreen)
        run: |
          sudo -u builder -H env QT_QPA_PLATFORM=offscreen HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
            HALLUCINATE_CONTROL_SOCKET=hallucinate-aur-smoke timeout 60 hallucinate --quit-after 3000
