name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0 dbus
      - run: pip install -e '.[test]'
      - run: dbus-run-session -- pytest -vv

  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.bulmaspanties.Hallucinate.yml
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-flatpak-smoke
        run: |
          dbus-run-session -- flatpak-builder --run flatpak-build \
            packaging/flatpak/io.github.bulmaspanties.Hallucinate.yml \
            env QT_QPA_PLATFORM=offscreen \
              HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
              HALLUCINATE_CONTROL_SOCKET=hallucinate-flatpak-smoke \
              hallucinate --quit-after 3000
