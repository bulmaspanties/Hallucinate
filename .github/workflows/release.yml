name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (e.g. 0.3.3): tags main as vX.Y.Z and publishes the release. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # The tag being released: the pushed tag, or v<version> for a manual release.
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  tag:
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the version and create the tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3"; exit 1; }
          grep -qx "version = \"$VERSION\"" pyproject.toml || { echo "::error::pyproject.toml is not at $VERSION"; exit 1; }
          grep -qx "__version__ = \"$VERSION\"" hallucinate/__init__.py || { echo "::error::hallucinate/__init__.py is not at $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Hallucinate $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "Hallucinate $VERSION" --generate-notes

  appimage:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: |
          OUT="hallucinate-${TAG#v}-x86_64.AppImage" packaging/appimage/build.sh
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-appimage-smoke
          XDG_CONFIG_HOME: /tmp/hallucinate-config
          XDG_DATA_HOME: /tmp/hallucinate-data
          XDG_CACHE_HOME: /tmp/hallucinate-cache
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0
          timeout 45 ./hallucinate-*-x86_64.AppImage --appimage-extract-and-run --quit-after 3000
      - uses: actions/upload-artifact@v6
        with:
          name: AppImage
          path: hallucinate-*.AppImage
      - name: Attach to release
        if: startsWith(env.TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed-name copy keeps releases/latest/download/... links (README, website) valid across versions.
          cp "hallucinate-${TAG#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage
          sha256sum "hallucinate-${TAG#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "hallucinate-${TAG#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage SHA256SUMS --clobber

  windows:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build exe, zip and installer
        shell: pwsh
        run: |
          $v = if ($env:TAG -like 'v*') { $env:TAG.TrimStart('v') } else { '' }
          ./packaging/windows/build.ps1 -Version $v
      - name: Smoke test (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $p = Start-Process dist\Hallucinate\Hallucinate.exe -ArgumentList '--quit-after','4000' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: Windows
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Attach to release
        if: startsWith(env.TAG, 'v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          v="${TAG#v}"
          cp "dist/hallucinate-$v-windows-x64-setup.exe" dist/Hallucinate-windows-x64-setup.exe  # fixed name for latest-download links
          gh release upload "$TAG" "dist/hallucinate-$v-windows-x64.zip" "dist/hallucinate-$v-windows-x64-setup.exe" \
            dist/Hallucinate-windows-x64-setup.exe --clobber

  macos:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build macOS app bundle
        run: packaging/macos/build.sh "${TAG#v}"
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-macos-smoke
          XDG_CONFIG_HOME: ${{ runner.temp }}/hallucinate-config
          XDG_DATA_HOME: ${{ runner.temp }}/hallucinate-data
          XDG_CACHE_HOME: ${{ runner.temp }}/hallucinate-cache
        run: |
          python3 -c 'import os, subprocess; subprocess.run(["dist/Hallucinate.app/Contents/MacOS/Hallucinate", "--quit-after", "3000"], env=os.environ.copy(), timeout=45, check=True)'
      - uses: actions/upload-artifact@v6
        with:
          name: macOS
          path: dist/*-macos-*.zip
      - name: Attach to release
        if: startsWith(env.TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          v="${TAG#v}"
          cp "dist/hallucinate-$v-macos-arm64.zip" dist/Hallucinate-macos-arm64.zip  # fixed name for latest-download links
          gh release upload "$TAG" "dist/hallucinate-$v-macos-arm64.zip" dist/Hallucinate-macos-arm64.zip --clobber
