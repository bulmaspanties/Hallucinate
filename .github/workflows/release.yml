name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: |
          OUT="hallucinate-${GITHUB_REF_NAME#v}-x86_64.AppImage" packaging/appimage/build.sh
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-appimage-smoke
          XDG_CONFIG_HOME: /tmp/hallucinate-config
          XDG_DATA_HOME: /tmp/hallucinate-data
          XDG_CACHE_HOME: /tmp/hallucinate-cache
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0
          timeout 45 ./hallucinate-*-x86_64.AppImage --appimage-extract-and-run --quit-after 3000
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage
          path: hallucinate-*.AppImage
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum hallucinate-*.AppImage > SHA256SUMS
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" hallucinate-*.AppImage SHA256SUMS --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build exe, zip and installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./packaging/windows/build.ps1 -Version $v
      - name: Smoke test (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $p = Start-Process dist\Hallucinate\Hallucinate.exe -ArgumentList '--quit-after','4000' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*-setup.exe --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build macOS app bundle
        run: packaging/macos/build.sh "${GITHUB_REF_NAME#v}"
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-macos-smoke
          XDG_CONFIG_HOME: ${{ runner.temp }}/hallucinate-config
          XDG_DATA_HOME: ${{ runner.temp }}/hallucinate-data
          XDG_CACHE_HOME: ${{ runner.temp }}/hallucinate-cache
        run: |
          python3 -c 'import os, subprocess; subprocess.run(["dist/Hallucinate.app/Contents/MacOS/Hallucinate", "--quit-after", "3000"], env=os.environ.copy(), timeout=45, check=True)'
      - uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: dist/*-macos-*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*-macos-*.zip --clobber
