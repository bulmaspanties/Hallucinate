name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release this version (e.g. 0.3.3): tags main as vX.Y.Z and publishes the release. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  # The tag being released: the pushed tag, or v<version> for a manual release.
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
  # What file names carry: the version for a release, dev-<run> for a build-only run (a branch name can hold "/").
  LABEL: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('dev-{0}', github.run_number) }}
  # Whether this run publishes: a version was given or a v* tag was pushed. Not "the tag starts with v": a
  # manual run from a branch called v2-work would otherwise publish that branch as a release.
  RELEASE: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  tag:
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the version and create the tag and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]] || { echo "::error::version must look like 1.2.3 or 1.2.3.4"; exit 1; }
          grep -qx "version = \"$VERSION\"" pyproject.toml || { echo "::error::pyproject.toml is not at $VERSION"; exit 1; }
          grep -qx "__version__ = \"$VERSION\"" hallucinate/__init__.py || { echo "::error::hallucinate/__init__.py is not at $VERSION"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Hallucinate $VERSION"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "Hallucinate $VERSION" --generate-notes

  appimage:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false  # build steps run third-party code; they don't need the token
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build AppImage
        run: |
          # appimagetool checks the desktop file with desktop-file-validate
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils
          OUT="hallucinate-${LABEL#v}-x86_64.AppImage" packaging/appimage/build.sh
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-appimage-smoke
          XDG_CONFIG_HOME: /tmp/hallucinate-config
          XDG_DATA_HOME: /tmp/hallucinate-data
          XDG_CACHE_HOME: /tmp/hallucinate-cache
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0 libxcb-cursor0
          timeout 45 ./hallucinate-*-x86_64.AppImage --appimage-extract-and-run --quit-after 3000
          timeout 90 ./hallucinate-*-x86_64.AppImage --appimage-extract-and-run --decode-check packaging/testclips/*
          ls -lh ./hallucinate-*-x86_64.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: AppImage
          path: hallucinate-*.AppImage
      - name: Attach to release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A fixed-name copy keeps releases/latest/download/... links (README, website) valid across versions.
          cp "hallucinate-${LABEL#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage
          sha256sum "hallucinate-${LABEL#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "hallucinate-${LABEL#v}-x86_64.AppImage" Hallucinate-x86_64.AppImage SHA256SUMS --clobber

  windows:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false  # build steps run third-party code; they don't need the token
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build exe, zip and installer
        shell: pwsh
        run: |
          $v = if ($env:TAG -like 'v*') { $env:TAG.TrimStart('v') } else { '' }
          ./packaging/windows/build.ps1 -Version $v
      - name: Smoke test (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\appdata
        run: |
          $p = Start-Process dist\Hallucinate\Hallucinate.exe -ArgumentList '--quit-after','4000' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'exe did not exit' }
          if ($p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode)" }
          $clips = (Get-ChildItem packaging\testclips).FullName
          $p = Start-Process dist\Hallucinate\Hallucinate.exe -ArgumentList (@('--decode-check') + $clips) -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'decode check did not finish' }
          if ($p.ExitCode -ne 0) { throw "some audio formats don't decode in the build" }
          Get-ChildItem dist\*.zip, dist\*-setup.exe | Format-Table Name, @{n='MB'; e={[math]::Round($_.Length / 1MB)}}
      - uses: actions/upload-artifact@v6
        with:
          name: Windows
          path: |
            dist/*.zip
            dist/*-setup.exe
      - name: Attach to release
        if: env.RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          v="${LABEL#v}"
          cp "dist/hallucinate-$v-windows-x64-setup.exe" dist/Hallucinate-windows-x64-setup.exe  # fixed name for latest-download links
          gh release upload "$TAG" "dist/hallucinate-$v-windows-x64.zip" "dist/hallucinate-$v-windows-x64-setup.exe" \
            dist/Hallucinate-windows-x64-setup.exe --clobber

  macos:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false  # build steps run third-party code; they don't need the token
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build macOS app bundle
        run: packaging/macos/build.sh "${LABEL#v}"
      - name: Smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          HALLUCINATE_DISABLE_LEGACY_MIGRATION: "1"
          HALLUCINATE_CONTROL_SOCKET: hallucinate-release-macos-smoke
          XDG_CONFIG_HOME: ${{ runner.temp }}/hallucinate-config
          XDG_DATA_HOME: ${{ runner.temp }}/hallucinate-data
          XDG_CACHE_HOME: ${{ runner.temp }}/hallucinate-cache
        run: |
          python3 -c 'import os, subprocess; subprocess.run(["dist/Hallucinate.app/Contents/MacOS/Hallucinate", "--quit-after", "3000"], env=os.environ.copy(), timeout=45, check=True)'
          python3 -c 'import glob, subprocess; subprocess.run(["dist/Hallucinate.app/Contents/MacOS/Hallucinate", "--decode-check", *sorted(glob.glob("packaging/testclips/*"))], timeout=90, check=True)'
          codesign --verify --deep --strict dist/Hallucinate.app
          ls -lh dist/*-macos-*.zip
      - uses: actions/upload-artifact@v6
        with:
          name: macOS
          path: dist/*-macos-*.zip
      - name: Attach to release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          v="${LABEL#v}"
          cp "dist/hallucinate-$v-macos-arm64.zip" dist/Hallucinate-macos-arm64.zip  # fixed name for latest-download links
          gh release upload "$TAG" "dist/hallucinate-$v-macos-arm64.zip" dist/Hallucinate-macos-arm64.zip --clobber

  # Our own Flatpak repository, served from the website (packaging/flatpak/README.md). The build is committed on
  # top of the previous release's repository, so updates download only what changed, then signed with the
  # FLATPAK_GPG_PRIVATE_KEY secret. Without that secret the job only says so.
  flatpak:
    needs: tag
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false  # build steps run third-party code; they don't need the token
      - name: Signing key
        id: key
        env:
          PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ] || [ ! -f packaging/flatpak/hallucinate-repo.gpg ]; then
            echo "::notice::No Flatpak signing key (FLATPAK_GPG_PRIVATE_KEY secret and packaging/flatpak/hallucinate-repo.gpg); skipping the Flatpak repository"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "$PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')
          # the secret must belong to the public key that is published
          gpg --batch --with-colons --show-keys packaging/flatpak/hallucinate-repo.gpg | grep -q ":$key:" \
            || { echo "::error::FLATPAK_GPG_PRIVATE_KEY doesn't match packaging/flatpak/hallucinate-repo.gpg"; exit 1; }
          echo "id=$key" >> "$GITHUB_OUTPUT"
          echo "home=$GNUPGHOME" >> "$GITHUB_OUTPUT"
      - name: Install Flatpak and Flathub's builder
        if: steps.key.outputs.id
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Previous release's repository
        if: steps.key.outputs.id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from=$(packaging/flatpak/fetch_repo.sh flatpak-repo "$TAG")
          echo "Continuing from: ${from:-nothing (a new repository)}"
      - name: Build
        if: steps.key.outputs.id
        run: |
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean --install-deps-from=flathub \
            --default-branch=stable --repo=flatpak-repo flatpak-build \
            packaging/flatpak/io.github.phosphene_dev.Hallucinate.yml
      - name: Sign, update the repository and make the bundle
        if: steps.key.outputs.id
        run: |
          packaging/flatpak/publish.sh flatpak-repo "${{ steps.key.outputs.id }}" "${{ steps.key.outputs.home }}" \
            packaging/flatpak/hallucinate-repo.gpg "hallucinate-${LABEL#v}-x86_64.flatpak"
      - name: Smoke test the bundle (offscreen)
        if: steps.key.outputs.id
        run: |
          flatpak install --user -y --noninteractive "hallucinate-${LABEL#v}-x86_64.flatpak"
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen \
            --env=HALLUCINATE_DISABLE_LEGACY_MIGRATION=1 \
            --env=HALLUCINATE_CONTROL_SOCKET=hallucinate-release-flatpak-smoke \
            io.github.phosphene_dev.Hallucinate --quit-after 3000
      - name: Attach to release
        if: steps.key.outputs.id && env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes || gh release view "$TAG" >/dev/null
          fi
          cp "hallucinate-${LABEL#v}-x86_64.flatpak" Hallucinate-x86_64.flatpak  # fixed name for latest-download links
          tar -cf flatpak-repo.tar -C flatpak-repo .  # the website serves this; the next release builds on it
          gh release upload "$TAG" "hallucinate-${LABEL#v}-x86_64.flatpak" Hallucinate-x86_64.flatpak flatpak-repo.tar \
            --clobber

  # Redeploy the website once every download is attached. A release created by this workflow's token doesn't
  # trigger other workflows, so call the Pages workflow directly.
  website:
    needs: [appimage, windows, macos, flatpak]
    if: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
