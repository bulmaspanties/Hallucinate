name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: format
    attributes:
      label: Audio format / file type (if relevant)
  - type: input
    id: env
    attributes:
      label: Environment
      description: Distro, desktop, Python, PySide6 and Qt versions
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of running `musicplayer` from a terminal. Remove any personal data.
      render: shell
